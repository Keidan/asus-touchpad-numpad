name: Build and Package

# Trigger conditions
on:
  push:
    branches:
      - '**' # Trigger on push to all branchs
    tags:
      - 'v*.*'           # match v1.2, v12.34, v1.2.3...
      - 'v*.*.*'         # match v1.2.3, v0.10.12, etc.
  pull_request:
    types: 
      # Trigger when PR is created or updated
      - opened
      - synchronize
      - reopened
  workflow_dispatch: # Manual trigger from the GitHub UI

# Default to read-only access; individual jobs can escalate as needed
permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    env:
      PKG_NAME: asus-touchpad-numpad
    # Needs write access to upload artifacts and create GitHub releases
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      # Install the stable Rust toolchain (rustc + cargo)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      # Cache Cargo registry, git sources and the build target directory
      # to speed up subsequent runs
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Install cyclonedx
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      # Install native libraries required to compile the crate,
      # and fpm to build .deb / .rpm packages
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libsystemd-dev \
            libudev-dev \
            ruby \
            ruby-dev \
            gcc \
            make
          sudo gem install fpm

      # Build release binary
      - name: Build release binary
        run: cargo build --release

      # Run the analysis with SonarCloud
      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 #v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # Invoke the packaging script which produces *.deb and *.rpm
      # in the workspace root using fpm
      - name: Build .deb and .rpm packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./create_packages.sh

      # Generate SBOM file
      - name: Generate CycloneDX SBOM
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries
      - name: Normalize local bom-refs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          jq '                                                                
          def clean_purl: sub("\\?download_url=[^#]*"; "") | sub("#.*$"; "");
          (
              [.. | objects
              | select(has("bom-ref") and has("purl"))
              | {key: ."bom-ref", value: (.purl | clean_purl)}
              ] | from_entries
          ) as $map
          | walk(if type == "object" and has("purl") then .purl |= clean_purl else . end)
          | walk(if type == "string" and in($map) then $map[.] else . end)
          ' ${{ env.PKG_NAME }}_bin.cdx.json > tmp.json && mv tmp.json ${{ env.PKG_NAME }}-sbom-bin.cdx.json
      - name: Find package files
        if: startsWith(github.ref, 'refs/tags/')
        id: find_pkgs
        run: |
          echo "deb=$(ls *.deb)" >> $GITHUB_OUTPUT
          echo "rpm=$(ls *.rpm)" >> $GITHUB_OUTPUT
      - name: Generate SBOM for .deb
        if: startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          file: ${{ steps.find_pkgs.outputs.deb }}
          format: cyclonedx-json
          output-file: ${{ env.PKG_NAME }}-sbom-deb.cdx.json
          upload-artifact: false
      - name: Generate SBOM for .rpm
        if: startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          file: ${{ steps.find_pkgs.outputs.rpm }}
          format: cyclonedx-json
          output-file: ${{ env.PKG_NAME }}-sbom-rpm.cdx.json
          upload-artifact: false
      - name: Format .deb/.rpm SBOM
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          jq . ${{ env.PKG_NAME }}-sbom-deb.cdx.json > tmp.json && mv tmp.json ${{ env.PKG_NAME }}-sbom-deb.cdx.json
          jq . ${{ env.PKG_NAME }}-sbom-rpm.cdx.json > tmp.json && mv tmp.json ${{ env.PKG_NAME }}-sbom-rpm.cdx.json
      # Only upload artifacts when the workflow was triggered by a tag push
      - name: Upload SBOM artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: sbom
          path: "*.cdx.json"
          if-no-files-found: error

      - name: Upload .deb artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: deb-package
          path: "*.deb"
          if-no-files-found: error

      - name: Upload .rpm artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: rpm-package
          path: "*.rpm"
          if-no-files-found: error

      # Strip the leading 'v' from the tag to get a bare version number
      # e.g. v0.1.0 -> TAG_NAME=v0.1.0, VERSION_NUMBER=0.1.0
      - name: Parse version number
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${{ github.ref_name }}
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VERSION_NUMBER=${TAG_NAME#v}" >> $GITHUB_ENV

      # Extract only the section of CHANGELOG.md that matches the current
      # version, so the release body does not include older entries
      - name: Read changelog content
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          CHANGELOG_FILE=CHANGELOG.md
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::error::Changelog file not found: $CHANGELOG_FILE"
            exit 1
          fi
          # Extract the block between “## [VERSION]” and the next “## [” or the end of the file
          CONTENT=$(awk "/^## \[$VERSION_NUMBER\]/{found=1; next} found && /^## \[/{exit} found{print}" "$CHANGELOG_FILE")
          if [ -z "$CONTENT" ]; then
            echo "::error::No changelog entry found for version $VERSION_NUMBER"
            exit 1
          fi
          printf "content<<EOF\n%s\nEOF\n" "$CONTENT" >> $GITHUB_OUTPUT

      # Create a GitHub release, attach the packages and populate the body
      # with the changelog section extracted above
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Version ${{ env.VERSION_NUMBER }}
          body: ${{ steps.changelog.outputs.content }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            *.deb
            *.rpm
            *.cdx.json